[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quicc-dynavis"
version = "0.1.0"
description = "Post-processing and visualization tools for QuICC dynamo simulations"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "pandas",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]
